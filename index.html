<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PandaGlow – Cute Lamps</title>
<style>
:root{--bg:#fff8ee;--card:#fff;--pink:#f8c8d4;--beige:#ead9c3;--brown:#4a2e22;--muted:#8a6f60;--accent:#e58aa2;--shadow:0 6px 20px rgba(74,46,34,.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1d17;--card:#3a2a22;--pink:#7a4a58;--beige:#54402f;--brown:#fbeee0;--muted:#cdb6a3;--accent:#f09ab2}}
:root[data-theme="dark"]{--bg:#2a1d17;--card:#3a2a22;--pink:#7a4a58;--beige:#54402f;--brown:#fbeee0;--muted:#cdb6a3;--accent:#f09ab2}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--brown);font:16px/1.5 Georgia,'Times New Roman',serif}
h1,h2,h3{font-family:'Trebuchet MS',system-ui,sans-serif;margin:.3em 0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:auto;padding:16px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);box-shadow:var(--shadow);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
nav .logo{font:700 20px 'Trebuchet MS',sans-serif;cursor:pointer;margin-right:auto}
nav a,.btn{cursor:pointer;text-decoration:none}
nav a{padding:6px 8px;border-radius:10px;color:var(--brown)}nav a:hover{background:var(--pink)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:700;transition:.2s;display:inline-block}
.btn:hover{transform:translateY(-2px)}.btn.alt{background:var(--beige);color:var(--brown)}.btn.sm{padding:6px 14px;font-size:14px}
.hero{display:grid;gap:20px;align-items:center;background:linear-gradient(135deg,var(--pink),var(--beige));border-radius:28px;padding:24px;margin:16px 0}
@media(min-width:720px){.hero{grid-template-columns:1fr 1fr;padding:40px}}
.hero img{width:100%;max-width:340px;margin:auto;display:block;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes loadbar{from{transform:translateX(-35%)}to{transform:translateX(130%)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px;position:relative}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:var(--beige);cursor:pointer}
.price s{color:var(--muted);margin-left:6px;font-size:14px}.price b{color:var(--accent)}
.tag{font-size:12px;background:var(--pink);border-radius:999px;padding:2px 8px;display:inline-block}
.heart{position:absolute;top:18px;right:18px;background:var(--card);border:0;border-radius:50%;width:34px;height:34px;cursor:pointer}
input,select,textarea{width:100%;padding:10px;border-radius:12px;border:1px solid var(--beige);background:var(--card);margin:4px 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:130px}
.note{background:var(--beige);border-radius:14px;padding:10px 14px;font-size:14px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--beige);text-align:left}
.tbl{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brown);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;z-index:9}
#toast.on{opacity:1}
footer{background:var(--card);margin-top:30px;padding:20px 16px;font-size:14px}
.two{display:grid;gap:20px}@media(min-width:720px){.two{grid-template-columns:1fr 1fr}}
.thumbs{display:flex;gap:8px;margin-top:8px}.thumbs img{width:56px;height:56px;border-radius:10px;cursor:pointer;object-fit:cover}
.order{background:linear-gradient(135deg,#e58aa2,#c96b86)}.acts{display:flex;gap:6px;flex-wrap:wrap}.err{color:#c0392b;font-size:13px;margin:-6px 0 8px}.opt{color:var(--muted);font-size:13px}.pv{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.pv div{position:relative}.pv img{width:70px;height:70px;object-fit:cover;border-radius:10px}.pv button{position:absolute;top:-6px;right:-6px;border:0;border-radius:50%;width:24px;height:24px;background:var(--brown);color:var(--bg);cursor:pointer}.tabs{display:flex;gap:8px;margin:10px 0}.mini{width:40px;height:40px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:6px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style></head><body>
<nav id="nav"></nav><main class="wrap" id="app" aria-live="polite"></main>
<footer id="foot"></footer><div id="toast" role="status"></div>
<script>
/* ===== CONFIG: rename the store or set your hero photo here ===== */
const BRAND={name:'PandaGlow',tagline:'A Little Glow, A Lot of Cuteness ✨',heroImage:'' /* put your panda lamp image URL or data URI */,
 contact:{email:'hello@example.com (placeholder)',phone:'03XX-XXXXXXX (placeholder)'},delivery:{fee:250,freeOver:5000}};
/* ===== DATA LAYER: swap this object for Firebase later (same method names) ===== */
const lampSVG=(c1,c2)=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#fff3e4"/><circle cx="55" cy="62" r="20" fill="#4a2e22"/><circle cx="145" cy="62" r="20" fill="#4a2e22"/><ellipse cx="100" cy="110" rx="62" ry="58" fill="${c1}"/><ellipse cx="78" cy="102" rx="14" ry="18" fill="#4a2e22"/><ellipse cx="122" cy="102" rx="14" ry="18" fill="#4a2e22"/><circle cx="80" cy="98" r="4" fill="#fff"/><circle cx="124" cy="98" r="4" fill="#fff"/><ellipse cx="100" cy="124" rx="7" ry="5" fill="#4a2e22"/><circle cx="62" cy="125" r="8" fill="${c2}" opacity=".7"/><circle cx="138" cy="125" r="8" fill="${c2}" opacity=".7"/><rect x="70" y="165" width="60" height="14" rx="7" fill="#4a2e22"/></svg>`);
const SAMPLE=[]; // No sample products are displayed.
/* Firebase web config (public identifiers, safe in frontend). Fill from Firebase Console > Project settings > Your apps. */
const FIREBASE_CONFIG={apiKey:'AIzaSyBPG0JOMwAcjGkPKXE0VQFys7r7OM6y5-w',authDomain:'pandaglow-34a7a.firebaseapp.com',projectId:'pandaglow-34a7a',storageBucket:'pandaglow-34a7a.firebasestorage.app',messagingSenderId:'794452995805',appId:'1:794452995805:web:5197794c0f8243af85f534'};
const cfgOK=!!(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId&&FIREBASE_CONFIG.appId);const ADMIN_PASSWORD='Muhammad 28';let FB=null,PEND=null;
let AD={user:null,ok:false,tab:'products',orders:[],form:null,busy:false,err:''};
const norm=p=>{const im=p.images&&p.images.length?p.images:p.img?[p.img]:[];return{colors:[],badge:'',cat:'Lamp',desc:'',stock:0,price:0,disc:0,...p,images:im,img:im[0]||lampSVG('#fff','#f8c8d4')}};
const DB={mode:cfgOK?'firebase':'demo',
 async init(){if(!cfgOK)throw new Error('Firebase configuration is incomplete');const u=m=>import('https://www.gstatic.com/firebasejs/10.12.2/firebase-'+m+'.js');const[a,au,fs,st]=await Promise.all([u('app'),u('auth'),u('firestore'),u('storage')]);let app;try{app=a.getApp()}catch{app=a.initializeApp(FIREBASE_CONFIG)}
  FB={...fs,...au,...st,db:fs.getFirestore(app),auth:au.getAuth(app),store:FIREBASE_CONFIG.storageBucket?st.getStorage(app):null};
  FB.onAuthStateChanged(FB.auth,x=>{AD.user=x;AD.ok=!!x});return FB;},
 async products(){if(!cfgOK||!FB||!FB.db)return [];try{const q=await Promise.race([FB.getDocs(FB.query(FB.collection(FB.db,'products'),FB.orderBy('createdAt','desc'))),new Promise((_,j)=>setTimeout(()=>j(new Error('Product loading timed out')),10000))]);return q.docs.map(d=>norm({id:d.id,...d.data()}))}catch(e){console.warn('Firebase products could not be read. Check Firestore setup/rules and hosting.',e);return []} },
 async placeOrder(o){if(!cfgOK||this.mode==='demo')return{id:'DEMO-'+Date.now().toString(36).toUpperCase(),saved:false};
  const id=PEND||(PEND='PG-'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase());
  await Promise.race([FB.setDoc(FB.doc(FB.db,'orders',id),{...o,orderNo:id,status:'Pending',createdAt:FB.serverTimestamp()}),new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),15000))]);PEND=null;return{id,saved:true}}};
async function probe(){try{await FB.getDocs(FB.query(FB.collection(FB.db,'orders'),FB.limit(1)));return true}catch{return false}}
/* ===== STATE ===== */
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let P=[],cart=ls.get('pg_cart',[]),wish=ls.get('pg_wish',[]),Q={q:'',cat:'All',sort:''};
const $=s=>document.querySelector(s),pkr=n=>'₨ '+Number(n).toLocaleString('en-PK');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hasP=p=>p.price>0,ok=p=>hasP(p)&&p.stock>0;
const eff=p=>p.disc&&p.disc<p.price?p.disc:p.price;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
function save(){ls.set('pg_cart',cart);ls.set('pg_wish',wish);nav()}
function add(id,color,qty=1){const p=P.find(x=>x.id==id);if(!p||!ok(p))return toast('Sorry, this lamp is unavailable');color=color||p.colors[0]||'';const i=cart.find(c=>c.id==id&&c.color==color);if(i)i.qty=Math.min(p.stock,i.qty+qty);else cart.push({id,color,qty:Math.min(p.stock,qty)});save();toast('Added to cart 🐼')}
let NOW=ls.get('pg_now',[]);
function buy(id,color,qty=1){const p=P.find(x=>x.id==id);if(!p||!ok(p))return toast('Sorry, this lamp is unavailable');NOW=[{id,color:color||p.colors[0]||'',qty:Math.min(p.stock,qty)}];ls.set('pg_now',NOW);location.hash='#/checkout/now'}
function wishT(id){wish=wish.includes(id)?wish.filter(x=>x!=id):[...wish,id];save();route()}
/* ===== COMPONENTS ===== */
function nav(){$('#nav').innerHTML=`<span class="logo" onclick="location.hash=''">🐼 ${esc(BRAND.name)}</span><a href="#/">Home</a><a href="#/shop">Shop</a><a href="#/about">About</a><a href="#/contact">Contact</a><a href="#/wishlist" aria-label="Wishlist">♡ ${wish.length}</a><a href="#/cart" aria-label="Cart">🛒 ${cart.reduce((a,c)=>a+c.qty,0)}</a><a class="btn sm alt" href="#/admin">Admin</a>`}
function card(p){const off=hasP(p)&&p.disc&&p.disc<p.price,d=ok(p)?'':'disabled style="opacity:.5"';return `<div class="card"><button class="heart" aria-label="Wishlist" onclick="wishT('${p.id}')">${wish.includes(p.id)?'♥':'♡'}</button><img src="${p.img}" alt="${esc(p.name)}" loading="lazy" onclick="location.hash='#/p/${p.id}'"><h3 style="font-size:16px">${esc(p.name)}</h3><div class="price">${hasP(p)?`<b>${pkr(eff(p))}</b>${off?`<s>${pkr(p.price)}</s>`:''}`:'<b>Price not set</b>'}</div><span class="tag">${!hasP(p)?'Unavailable':p.stock>0?'In stock':'Out of stock'}</span><p class="acts"><button class="btn sm" ${d} onclick="add('${p.id}')">Add to Cart</button><button class="btn sm order" ${d} onclick="buy('${p.id}')">🛍️ Order Now</button></p></div>`}
function foot(){$('#foot').innerHTML=`<div class="wrap two"><div><b>${esc(BRAND.name)}</b><p>${esc(BRAND.contact.email)}<br>${esc(BRAND.contact.phone)}</p><p>Instagram · Facebook · TikTok (add your links)</p></div><div><b>FAQs</b> – How long is delivery? Add your own answer.<br><b>Shipping</b> – Delivery fee ${pkr(BRAND.delivery.fee)}, free over ${pkr(BRAND.delivery.freeOver)}.<br><b>Returns</b> – Add your return policy here.</div></div>`}
function lines(items){return items.map(c=>({c,p:P.find(x=>x.id==c.id)})).filter(l=>l.p&&ok(l.p))}
function totals(items=cart){const sub=lines(items).reduce((a,{c,p})=>a+eff(p)*c.qty,0);const del=!sub||sub>=BRAND.delivery.freeOver?0:BRAND.delivery.fee;return{sub,del,total:sub+del}}
/* ===== PAGES ===== */
const pages={
home(){const best=P.filter(p=>p.badge=='best'),nw=P.filter(p=>p.badge=='new');return `<section class="hero"><div><h1 style="font-size:clamp(28px,6vw,46px)">${BRAND.tagline}</h1><p>Bring cozy vibes and adorable lighting into your everyday life.</p><a class="btn" href="#/shop">Shop Now</a></div><img src="${P[0]?.img||''}" alt="Panda lamp"></section>
<h2>Featured</h2><div class="grid">${P.slice(0,4).map(card).join('')}</div><h2>Best Sellers</h2><div class="grid">${best.map(card).join('')}</div><h2>New Arrivals</h2><div class="grid">${nw.map(card).join('')}</div>
<section class="hero" style="text-align:center;display:block"><h2>Make Your Room Magical ✨</h2><p>Soft light, sweet shapes, instant cozy.</p><a class="btn alt" href="#/shop">Explore lamps</a></section>
<h2>Reviews</h2><p class="note">These are clearly sample reviews until real customer reviews are added.</p><div class="grid">${['“Sample review: so cute!” – Sample Customer','“Sample review: perfect gift.” – Sample Customer','“Sample review: cozy glow.” – Sample Customer'].map(r=>`<div class="card">${r}<br><span class="tag">Sample</span></div>`).join('')}</div>`},
shop(){const cats=['All',...new Set(P.map(p=>p.cat))];let l=P.filter(p=>(Q.cat=='All'||p.cat==Q.cat)&&p.name.toLowerCase().includes(Q.q.toLowerCase()));if(Q.sort=='asc')l.sort((a,b)=>eff(a)-eff(b));if(Q.sort=='desc')l.sort((a,b)=>eff(b)-eff(a));
return `<h1>Shop</h1><div class="row"><input id="q" placeholder="Search lamps…" aria-label="Search" value="${esc(Q.q)}"><select id="cat" aria-label="Category">${cats.map(c=>`<option ${c==Q.cat?'selected':''}>${c}</option>`).join('')}</select><select id="sort" aria-label="Sort"><option value="">Sort by price</option><option value="asc" ${Q.sort=='asc'?'selected':''}>Low → High</option><option value="desc" ${Q.sort=='desc'?'selected':''}>High → Low</option></select></div>${l.length?`<div class="grid">${l.map(card).join('')}</div>`:'<p>No lamps match. Try another search 🐼</p>'}`},
wishlist(){const l=P.filter(p=>wish.includes(p.id));return `<h1>Wishlist</h1>${l.length?`<div class="grid">${l.map(card).join('')}</div>`:'<p>Your wishlist is empty.</p>'}`},
p(id){const p=P.find(x=>x.id==id);if(!p)return '<p>Product not found.</p>';return `<div class="two"><div><img id="big" src="${p.img}" alt="${esc(p.name)}" style="width:100%;border-radius:20px"><div class="thumbs">${p.images.map(s=>`<img src="${s}" alt="" onclick="$('#big').src=this.src">`).join('')}</div></div><div><h1>${esc(p.name)}</h1><div class="price">${hasP(p)?`<b>${pkr(eff(p))}</b>${p.disc&&p.disc<p.price?`<s>${pkr(p.price)}</s>`:''}`:'<b>Price not set</b>'}</div><span class="tag">${!hasP(p)?'Unavailable until a price is set':p.stock>0?p.stock+' in stock':'Out of stock'}</span><p>${esc(p.desc)}</p><label>Color<select id="col">${p.colors.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><label>Quantity<input id="qty" type="number" min="1" max="${Math.max(1,p.stock)}" value="1"></label><p class="acts"><button class="btn" ${ok(p)?'':'disabled'} onclick="add('${p.id}',$('#col').value,Math.max(1,+$('#qty').value||1))">Add to Cart</button><button class="btn order" ${ok(p)?'':'disabled'} onclick="buy('${p.id}',$('#col').value,Math.max(1,+$('#qty').value||1))">🛍️ Order Now</button></p><h3>Reviews</h3><p class="note">No real reviews yet.</p></div></div>`},
cart(){if(!cart.length)return '<h1>Cart</h1><p>Your cart is empty 🛒</p><a class="btn" href="#/shop">Start shopping</a>';const t=totals();return `<h1>Cart</h1>${cart.map((c,i)=>{const p=P.find(x=>x.id==c.id);return p?`<div class="card row" style="margin:8px 0"><img src="${p.img}" alt="" style="max-width:70px;border-radius:10px"><div>${esc(p.name)}<br><small>${esc(c.color)} · ${pkr(eff(p))}</small></div><input type="number" min="1" max="${p.stock}" value="${c.qty}" aria-label="Quantity" onchange="cart[${i}].qty=Math.min(${p.stock},Math.max(1,+this.value||1));save();route()"><button class="btn sm alt" onclick="cart.splice(${i},1);save();route()">Remove</button></div>`:''}).join('')}<p>Subtotal: ${pkr(t.sub)}<br>Delivery: ${t.del?pkr(t.del):'Free'}<br><b>Total: ${pkr(t.total)}</b></p><a class="btn" href="#/checkout">Checkout</a>`},
checkout(arg){const now=arg=='now',L=lines(now?NOW:cart);if(!L.length)return now?'<h1>Checkout</h1><p>That lamp is unavailable.</p><a class="btn" href="#/shop">Back to shop</a>':pages.cart();const t=totals(now?NOW:cart);
const f=(i,l,x='',o)=>`<label>${l} ${o?'<span class="opt">(optional)</span>':''}<input id="${i}" ${x}></label><div class="err" id="e_${i}"></div>`;
return `<h1>Checkout</h1><div class="note">Payment: Cash on Delivery.${DB.mode=='demo'?' <b>Demo mode:</b> no database is connected, so orders are not saved yet.':''}</div><div class="two"><div>${f('n','Full name *','autocomplete="name"')}${f('ph','Phone number *','type="tel" autocomplete="tel" placeholder="03XXXXXXXXX"')}${f('hn','House number *')}${f('st','Street or area *')}${f('ct','City *','autocomplete="address-level2"')}<label>Complete delivery address *<textarea id="ad" rows="3"></textarea></label><div class="err" id="e_ad"></div>${f('pc','Postal code','inputmode="numeric"',1)}${f('em','Email address','type="email" autocomplete="email"',1)}<p id="err" style="color:#c0392b"></p><button class="btn" id="go" onclick="place('${arg||''}')">Place Order (COD)</button></div><div class="card"><b>Order summary</b>${L.map(({c,p})=>`<p><img class="mini" src="${p.img}" alt="">${esc(p.name)}${c.color?' ('+esc(c.color)+')':''}<br>${c.qty} × ${pkr(eff(p))} = ${pkr(eff(p)*c.qty)}</p>`).join('')}<p>Subtotal: ${pkr(t.sub)}<br>Delivery fee: ${t.del?pkr(t.del):'Free'}<br><b>Total: ${pkr(t.total)}</b></p></div></div>`},
confirm(){const o=ls.get('pg_last');if(!o)return '<p>No order to show.</p>';return `<h1>${o.saved?'Order received 🎉':'Order preview'}</h1><p class="note">${o.saved?'Your order has been saved.':'<b>Demo mode:</b> this order was NOT saved or sent to the store. Connect Firebase to take real orders.'}</p><p>Reference: ${esc(o.id)}<br>Name: ${esc(o.name)}<br>Total: ${pkr(o.total)}</p><a class="btn" href="#/shop">Keep shopping</a>`},
about(){return `<h1>About ${esc(BRAND.name)}</h1><p>We make cozy rooms cuter, one little glow at a time. (Edit this text with your real story.)</p>`},
contact(){return `<h1>Contact</h1><p>${esc(BRAND.contact.email)}<br>${esc(BRAND.contact.phone)}</p>`},
admin(){if(!AD.ok)return `<h1>Admin Login</h1><div class="card" style="max-width:380px"><label>Admin password<input id="ap" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()" placeholder="Enter admin password"></label><p class="err" style="margin:0 0 8px">${esc(AD.err)}</p><button class="btn" onclick="login()" ${AD.busy?'disabled':''}>Login</button></div>`;
const F=AD.form,fi=(k,l,x='')=>`<label>${l}<input ${x} value="${esc(F[k]??'')}" oninput="AD.form.${k}=this.value"></label>`;
const prod=F?`<div class="card"><h3>${F.id?'Edit':'Add'} lamp</h3>${fi('name','Title')}<label>Description<textarea rows="3" oninput="AD.form.desc=this.value">${esc(F.desc)}</textarea></label><div class="row">${fi('price','Price (PKR)','type="number" min="0"')}${fi('disc','Discount price (optional)','type="number" min="0"')}${fi('stock','Stock','type="number" min="0"')}</div><div class="row">${fi('cat','Category')}${fi('colors','Colors (comma separated)')}<label>Badge<select onchange="AD.form.badge=this.value"><option value="">None</option><option value="best" ${F.badge=='best'?'selected':''}>Best seller</option><option value="new" ${F.badge=='new'?'selected':''}>New</option></select></label></div><b>Pictures (preview)</b><div class="pv">${F.images.map((m,i)=>`<div><img src="${m}" alt=""><button aria-label="Remove picture" onclick="AD.form.images.splice(${i},1);route()">✕</button></div>`).join('')||'<small>No pictures yet</small>'}</div><label class="btn sm alt">Upload / add pictures<input type="file" accept="image/*" multiple hidden onchange="addImgs(this.files)"></label><p class="err" id="perr"></p><p class="acts"><button class="btn" onclick="saveProd()" ${AD.busy?'disabled':''}>${AD.busy?'Saving…':'Save'}</button><button class="btn alt" onclick="AD.form=null;route()">Cancel</button></p></div>`:'';
const pl=`<button class="btn sm" onclick="AD.form={name:'',desc:'',price:'',disc:'',stock:0,cat:'Lamp',colors:'',badge:'',images:[]};route()">+ Add lamp</button>${prod}<div class="tbl"><table>${P.map(p=>`<tr><td><img class="mini" src="${p.img}" alt="">${esc(p.name)}</td><td>${hasP(p)?pkr(p.price)+(p.disc?' / '+pkr(p.disc):''):'No price'}</td><td>${p.stock}</td><td><button class="btn sm alt" onclick="editProd('${p.id}')">Edit</button> <button class="btn sm alt" onclick="delProd('${p.id}')">Delete</button></td></tr>`).join('')}</table></div>`;
const dt=o=>o.createdAt?.toDate?o.createdAt.toDate().toLocaleString('en-PK'):'';
const ol=`<button class="btn sm alt" onclick="loadOrders()">Refresh</button><div class="tbl"><table><tr><th>No.</th><th>Customer</th><th>Product</th><th>Total</th><th>Date</th><th>Status</th><th></th></tr>${AD.orders.map(o=>`<tr><td>${esc(o.orderNo||o.id)}</td><td>${esc(o.name)}<br>${esc(o.phone)}</td><td>${(o.items||[]).map(i=>`<img class="mini" src="${esc(i.img||P.find(p=>p.id==i.id)?.img||'')}" alt="">${esc(i.name)} ×${i.qty}`).join('<br>')}</td><td>${pkr(o.total||0)}</td><td>${esc(dt(o))}</td><td><select onchange="setStatus('${o.id}',this.value)">${['Pending','Confirmed','Shipped','Delivered','Cancelled'].map(x=>`<option ${x==o.status?'selected':''}>${x}</option>`).join('')}</select></td><td><details><summary>Details</summary><p>${esc(o.address)}<br>House ${esc(o.house||'')}, ${esc(o.street||'')}, ${esc(o.city||'')} ${esc(o.postal||'')}<br>${o.email?esc(o.email)+'<br>':''}${(o.items||[]).map(i=>`${esc(i.name)} ${i.color?'('+esc(i.color)+') ':''}${i.qty} × ${pkr(i.price)}`).join('<br>')}<br>Subtotal ${pkr(o.subtotal||0)} · Delivery ${pkr(o.delivery||0)}<br><b>Total ${pkr(o.total||0)}</b> · ${esc(o.payment||'')}</p></details></td></tr>`).join('')||'<tr><td colspan="7">No orders yet.</td></tr>'}</table></div>`;
return `<div class="row"><h1 style="flex:3">Admin</h1><button class="btn sm alt" onclick="logout()">Logout</button></div><div class="tabs"><button class="btn sm ${AD.tab=='products'?'':'alt'}" onclick="AD.tab='products';route()">Products</button><button class="btn sm ${AD.tab=='orders'?'':'alt'}" onclick="AD.tab='orders';loadOrders()">Orders</button></div>${AD.tab=='products'?pl:ol}`}};
async function place(mode){const v=i=>$('#'+i).value.trim(),R={n:'Please enter your full name.',hn:'Please enter your house number.',st:'Please enter your street or area.',ct:'Please enter your city.',ad:'Please enter your complete delivery address.'},d={};['n','ph','hn','st','ct','ad','pc','em'].forEach(i=>d[i]=v(i));let bad=0;
 const E=(i,m)=>{$('#e_'+i).textContent=m;if(m)bad++};for(const i in R)E(i,d[i]?(i=='ad'&&d[i].length<8?'Address looks too short.':''):R[i]);
 E('ph',!d.ph?'Please enter your phone number.':/^(\+?92|0)?3\d{9}$/.test(d.ph.replace(/[\s-]/g,''))?'':'Enter a valid Pakistani mobile number, e.g. 03XXXXXXXXX.');
 E('pc',d.pc&&!/^\d{5}$/.test(d.pc)?'Postal code should be 5 digits (or leave it empty).':'');E('em',d.em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.em)?'Enter a valid email (or leave it empty).':'');
 if(bad){$('#err').textContent='Please fix the highlighted fields.';return}$('#err').textContent='';
 const src=mode=='now'?NOW:cart,L=lines(src),t=totals(src);if(!L.length){$('#err').textContent='These items are no longer available.';return}
 $('#go').disabled=true;$('#go').textContent='Placing…';
 try{const o={name:d.n,phone:d.ph,house:d.hn,street:d.st,city:d.ct,address:d.ad,postal:d.pc,email:d.em,payment:'Cash on Delivery',items:L.map(({c,p})=>({id:p.id,name:p.name,img:/^https?:/.test(p.img)?p.img:'',color:c.color,qty:c.qty,price:eff(p)})),subtotal:t.sub,delivery:t.del,total:t.total};
  const r=await DB.placeOrder(o);ls.set('pg_last',{...r,name:d.n,total:t.total});if(r.saved){if(mode=='now'){NOW=[];ls.set('pg_now',[])}else{cart=[];save()}}location.hash='#/confirm'}
 catch(e){$('#err').textContent='We could not save your order, so it was NOT placed. Please check your connection and try again.';$('#go').disabled=false;$('#go').textContent='Place Order (COD)'}}
/* ===== ADMIN ACTIONS ===== */
async function login(){AD.busy=true;AD.err='';const p=$('#ap')?.value||'';if(p!==ADMIN_PASSWORD){AD.err='Incorrect password.';AD.busy=false;route();return}AD.ok=true;AD.user={passwordOnly:true};AD.busy=false;route();if(FB)await loadOrders(1)}
function logout(){AD={user:null,ok:false,tab:'products',orders:[],form:null,busy:false,err:''};route()}
async function loadOrders(q){try{const r=await FB.getDocs(FB.query(FB.collection(FB.db,'orders'),FB.orderBy('createdAt','desc'),FB.limit(200)));AD.orders=r.docs.map(d=>({id:d.id,...d.data()}))}catch{toast('Could not load orders')}if(!q)route()}
async function setStatus(id,st){try{await FB.updateDoc(FB.doc(FB.db,'orders',id),{status:st});toast('Status updated')}catch{toast('Could not update status');loadOrders()}}
function editProd(id){const p=P.find(x=>x.id==id);AD.form={id,name:p.name,desc:p.desc,price:p.price||'',disc:p.disc||'',stock:p.stock,cat:p.cat,colors:p.colors.join(', '),badge:p.badge,images:[...p.images]};route();scrollTo(0,0)}
function shrink(f){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const i=new Image();i.onerror=rej;i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};i.src=r.result};r.readAsDataURL(f)})}
async function addImgs(fs){for(const f of fs){if(AD.form.images.length>=4){toast('Maximum 4 pictures');break}try{AD.form.images.push(await shrink(f))}catch{toast('Could not read that picture')}}route()}
async function saveProd(){const F=AD.form,pe=m=>{$('#perr').textContent=m},price=+F.price||0,disc=+F.disc||0,stock=Math.max(0,Math.floor(+F.stock||0));if(!FB||!FB.db){return pe('Firebase is not connected. Check the Firebase config and internet connection; admin login alone cannot save products or pictures.')} 
 if(!F.name.trim())return pe('Please enter a title.');if(price<0||disc<0)return pe('Prices cannot be negative.');if(disc&&(!price||disc>=price))return pe('Discount price must be lower than the price.');
 AD.busy=true;route();try{const col=FB.collection(FB.db,'products'),id=F.id||FB.doc(col).id,imgs=[];
  for(const [i,m] of F.images.entries()){if(m.startsWith('data:')&&FB.store){try{const r=FB.ref(FB.store,`products/${id}/${Date.now()}-${i}.jpg`);await FB.uploadString(r,m,'data_url');imgs.push(await FB.getDownloadURL(r))}catch(ue){console.warn('Storage upload failed, keeping compressed image in Firestore',ue);imgs.push(m);toast('Storage unavailable: picture kept inside the product instead')}}else imgs.push(m)}
  if(imgs.join('').length>700000)throw new Error('Pictures too large. Remove one or enable Firebase Storage.');
  const data={name:F.name.trim(),desc:F.desc.trim(),price,disc,stock,cat:F.cat.trim()||'Lamp',colors:F.colors.split(',').map(x=>x.trim()).filter(Boolean),badge:F.badge,images:imgs};
  if(F.id)await FB.updateDoc(FB.doc(FB.db,'products',id),{...data,updatedAt:FB.serverTimestamp()});else await FB.setDoc(FB.doc(FB.db,'products',id),{...data,createdAt:FB.serverTimestamp()});
  P=await DB.products();AD.form=null;toast('Saved ✓')}catch(e){AD.busy=false;route();pe('Could not save: '+(e.message||'permission or network error'));return}
 AD.busy=false;nav();route()}
async function delProd(id){if(!confirm('Delete this lamp?'))return;try{await FB.deleteDoc(FB.doc(FB.db,'products',id));P=await DB.products();toast('Deleted')}catch{toast('Could not delete')}route()}
function route(){const [,pg='home',arg]=(location.hash||'#/').split('/');const f=pages[pg||'home']||pages.home;$('#app').innerHTML=f(arg);
 const q=$('#q');if(q){q.oninput=e=>{Q.q=e.target.value;const pos=e.target.selectionStart;route();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};$('#cat').onchange=e=>{Q.cat=e.target.value;route()};$('#sort').onchange=e=>{Q.sort=e.target.value;route()}}scrollTo(0,0)}
addEventListener('hashchange',route);
